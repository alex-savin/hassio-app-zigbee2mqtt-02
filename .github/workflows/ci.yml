name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Get addon version
        id: addon
        run: echo "version=$(yq '.version' zigbee2mqtt-02/config.yaml)" >> "$GITHUB_OUTPUT"

      - name: Prepare build context
        run: |
          cp -R common/rootfs zigbee2mqtt-02/
          cp common/Dockerfile zigbee2mqtt-02/

      - name: Test build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: amd64
          context: ./zigbee2mqtt-02
          image: ghcr.io/${{ github.repository_owner }}/zigbee2mqtt-02-amd64
          image-tags: test
          version: ${{ steps.addon.outputs.version }}
          push: "false"
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.22
            BUILD_VERSION=${{ steps.addon.outputs.version }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate config.yaml
        run: |
          echo "Validating config.yaml..."
          yq -e '.' zigbee2mqtt-02/config.yaml > /dev/null
          echo "config.yaml is valid YAML"

      - name: Validate repository.yaml
        run: |
          echo "Validating repository.yaml..."
          yq -e '.' repository.yaml > /dev/null
          echo "repository.yaml is valid YAML"

      - name: Check required fields
        run: |
          SLUG=$(yq '.slug' zigbee2mqtt-02/config.yaml)
          VERSION=$(yq '.version' zigbee2mqtt-02/config.yaml)
          IMAGE=$(yq '.image' zigbee2mqtt-02/config.yaml)
          echo "Slug: $SLUG"
          echo "Version: $VERSION"
          echo "Image: $IMAGE"
          [[ "$SLUG" == "zigbee2mqtt-02" ]] || { echo "ERROR: Unexpected slug"; exit 1; }
          [[ -n "$VERSION" && "$VERSION" != "null" ]] || { echo "ERROR: Missing version"; exit 1; }
          [[ -n "$IMAGE" && "$IMAGE" != "null" ]] || { echo "ERROR: Missing image"; exit 1; }
